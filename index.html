<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bible Verse</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: url('Nature.jpg') center/cover no-repeat fixed;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #fff;
    }
    .blur-card {
      width: min(700px, 90vw);
      padding: 2rem 2.5rem;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.25);
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 2rem;
      letter-spacing: 0.5px;
    }
    p {
      margin: 0;
      line-height: 1.6;
      font-size: 1.05rem;
    }
    .accent {
      width: 60px;
      height: 3px;
      background: #ffd166;
      border-radius: 2px;
      margin: 0.5rem 0 1rem;
    }
  </style>
</head>
<body>
  <main class="blur-card">
    <h1>Bible Verse</h1>
    <div class="accent"></div>
    <p>John 3:16 — For God so loved the world that He gave His only begotten Son, that whosoever believeth in Him should not perish, but have eternal life.</p>
  </main>
</body>
</html>
